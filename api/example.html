<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пример: такси на Cavi Maps API</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#1f2a27; background:#f4f5f2; }
  header { padding:14px 16px; background:#ffd23f; font-weight:700; font-size:18px; }
  #map { height:56vh; min-height:300px; background:#e9e7df; }
  .panel { padding:14px 16px; display:grid; gap:10px; max-width:640px; }
  .pts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pt { background:#fff; border:1px solid #dfe3df; border-radius:10px; padding:8px 10px; font-size:13px; }
  .pt b { display:block; font-size:12px; color:#66706c; font-weight:500; }
  .sum { background:#fff; border-radius:12px; padding:12px; border:1px solid #dfe3df; display:flex; gap:18px; flex-wrap:wrap; }
  .sum div b { display:block; font-size:22px; }
  .sum div span { font-size:12px; color:#66706c; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:#1f2a27; color:#fff; cursor:pointer; }
  .hint { font-size:13px; color:#66706c; }
</style>
</head>
<body>
<header>Такси — пример подключения Cavi Maps</header>
<div id="map"></div>
<div class="panel">
  <div class="hint" id="hint">Нажмите на карту: сначала точка посадки (А), затем точка назначения (Б).</div>
  <div class="pts">
    <div class="pt"><b>Откуда (А)</b><span id="a">—</span></div>
    <div class="pt"><b>Куда (Б)</b><span id="b">—</span></div>
  </div>
  <div class="sum">
    <div><b id="km">—</b><span>расстояние</span></div>
    <div><b id="min">—</b><span>в пути</span></div>
    <div><b id="price">—</b><span>цена (пример: 5 c. + 2.5 c./км)</span></div>
  </div>
  <div><button id="reset">Заново</button></div>
</div>
<script src="cavi-maps.js"></script>
<script>
  // Ключ создаётся в api/admin.html и работает только на разрешённых сайтах.
  var map = CaviMaps.create(document.getElementById('map'), { key: 'cm_demo_7Qx2Lp9Va4', lat: 38.5737, lon: 68.7738, zoom: 13 });
  var A = null, B = null, $ = function (id) { return document.getElementById(id); };
  var fmt = function (p) { return p.lat.toFixed(5) + ', ' + p.lon.toFixed(5); };
  map.on('error', function (e) { $('hint').textContent = 'Ошибка ключа: ' + e.message; });
  map.on('click', function (p) {
    if (!A || (A && B)) { A = p; B = null; map.clear().setMarkers([{ lat: p.lat, lon: p.lon, label: 'А', color: '#12ad50' }]); $('a').textContent = fmt(p); $('b').textContent = '—'; ['km', 'min', 'price'].forEach(function (id) { $(id).textContent = '—'; }); return; }
    B = p; $('b').textContent = fmt(p); $('hint').textContent = 'Строим маршрут…';
    map.route({ from: [A.lat, A.lon], to: [B.lat, B.lon], mode: 'car', fromLabel: 'А', toLabel: 'Б' }).then(function (r) {
      var km = r.meters / 1000;
      $('km').textContent = km.toFixed(1) + ' км';
      $('min').textContent = Math.max(1, Math.round(r.seconds / 60)) + ' мин';
      $('price').textContent = Math.round(5 + 2.5 * km) + ' c.';
      $('hint').textContent = 'Маршрут построен. Нажмите на карту, чтобы выбрать новую поездку.';
    }, function (e) { $('hint').textContent = 'Маршрут не найден: ' + e.message; });
  });
  $('reset').onclick = function () { A = B = null; map.clear(); ['a', 'b', 'km', 'min', 'price'].forEach(function (id) { $(id).textContent = '—'; }); };
</script>
</body>
</html>
