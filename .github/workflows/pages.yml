# Builds the map and publishes it to the gh-pages branch, which GitHub Pages serves
# under the current repository name. Runs on every push to main.
name: Deploy Cavi Maps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build for the current repository
        run: npm run build
        env:
          ATLAS_BASE: /${{ github.event.repository.name }}/
      # Pages has no rewrites: nested app URLs fall through to the app in 404.html.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          single-commit: true
