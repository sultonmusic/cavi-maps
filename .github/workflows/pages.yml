# Builds the map and publishes it to the gh-pages branch, which GitHub Pages serves
# at https://sultonmusic.github.io/cavi-maps/. Runs on every push to main.
name: Deploy Cavi Maps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build for /cavi-maps/
        run: npm run build
        env:
          ATLAS_BASE: /cavi-maps/
      # Pages has no rewrites: /cavi-maps/admin falls through to 404.html, which is the app itself.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          single-commit: true
